<style>
:root{
  --yami:#0a0b0e; --pnl:#13161b; --pnl-2:#1b1f26; --fuchi:#272c35; --kage:#050608;
  --shiro:#e8eaed; --nibi:#9aa0aa; --akari:#f0b46a;
  --f-hon:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-na:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --f-fuda:"DotGothic16","Zen Kaku Gothic New",ui-monospace,monospace;
  color-scheme:dark;
}
html{background:var(--yami)}
body{
  margin:0;min-height:100vh;min-height:100svh;background:var(--yami);color:var(--shiro);
  font-family:var(--f-hon);font-weight:500;font-size:16px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
.wrap{
  max-width:400px;margin:0 auto;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:40px;min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;justify-content:center;gap:32px;
}
@media (max-height:460px){.wrap{padding-block:16px}} 
.me{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.na{margin:0;font-family:var(--f-na);font-weight:400;font-size:28px;line-height:1.3;letter-spacing:.04em}
.hito{margin:0;color:var(--nibi);font-size:14px;letter-spacing:.04em}
.links{display:flex;flex-direction:column;gap:16px}
.ln{
  display:flex;align-items:center;gap:12px;min-height:68px;box-sizing:border-box;
  padding:12px 16px 12px 12px;border:1px solid var(--fuchi);border-radius:14px;
  background:var(--pnl);color:var(--shiro);text-decoration:none;
  box-shadow:0 4px 0 var(--kage);
  transition:transform .08s ease-out,box-shadow .08s ease-out,border-color .15s;
}
.ln:hover{border-color:var(--akari)}
.ln:focus-visible{outline:2px solid var(--akari);outline-offset:3px}
.ln:active,.ln.osu{transform:translateY(4px);box-shadow:0 0 0 var(--kage);background:var(--pnl-2)}
.ic{
  flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:10px;
  background:var(--pnl-2);color:var(--shiro);
}
.ic svg{width:22px;height:22px;fill:currentColor}
.ic.vrc svg{width:30px;height:30px}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-weight:700;font-size:17px;line-height:1.3}
.s{font-family:var(--f-fuda);font-size:13px;line-height:1.3;color:var(--nibi);letter-spacing:.02em;overflow-wrap:anywhere}
.ya{flex:none;width:18px;height:18px;color:var(--nibi);transition:transform .15s,color .15s}
.ya svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ln:hover .ya{transform:translateX(3px);color:var(--akari)}
</style>

<script>

  [].slice.call(document.querySelectorAll('.ln')).forEach(function(a){
